services:
  - type: web
    name: sonora-studio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      # Change this when deploying on a different production domain.
      - key: SITE_URL
        value: "https://sonora.rawse.in"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DAILY_QUOTA_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sonora-demo-db
          property: connectionString

databases:
  - name: sonora-demo-db
    plan: free
    region: oregon
    databaseName: sonora_demo
    user: sonora_demo
